<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Drop</title>
<script src="../shared/config.js"></script>
<script src="../shared/kit.js"></script>
<script src="../shared/strings.js"></script>
<script src="../shared/registry.js"></script>
<script src="strings.js"></script>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/styles.css">
<link rel="stylesheet" href="word-drop.css">
<link rel="manifest" href="../manifest.webmanifest">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="heart" viewBox="0 0 24 24"><path d="M12 20.6 4.3 13.2a4.9 4.9 0 0 1 7-6.9l.7.7.7-.7a4.9 4.9 0 0 1 7 6.9z"/></symbol>
  </defs>
</svg>

<!-- SETUP -->
<section id="view-setup">
  <div class="wrap">
    <div class="row-between"><button class="link-back" id="back-hub" type="button" data-i18n="allGames">← All games</button><span data-lang-switch></span></div>
    <div class="setup-head">
      <div><span class="eyebrow" data-i18n="gameSetup">Game setup</span><h1 data-i18n="wd.title">Word Drop</h1></div>
      <div data-logo></div>
    </div>
    <div class="setup">
      <div class="panel">
        <div class="field-group">
          <div class="row-between"><label for="words" data-i18n="wd.words">Words</label><span class="count" id="word-count"></span></div>
          <p class="hint" data-i18n="wd.wordsHint"></p>
          <textarea id="words" spellcheck="false"></textarea>
        </div>
        <div id="content-tools"></div>
        <fieldset class="task-row"><span class="legend" data-i18n="wd.task">What students do with each word</span><div class="seg" id="seg-task"></div><span class="hint" data-i18n="wd.taskHint"></span></fieldset>
      </div>
      <div class="panel">
        <div class="field-group">
          <div class="row-between"><label for="teams" data-i18n="classList">Teams or students</label><span class="count" id="team-count"></span></div>
          <p class="hint" data-i18n="wd.teamsHint"></p>
          <p class="hint" id="split-note"></p>
          <textarea id="teams" spellcheck="false"></textarea>
          <div id="roster"></div>
        </div>
        <fieldset><span class="legend" data-i18n="lives">Lives</span><div class="seg" id="seg-lives"></div><span class="hint" id="lives-note"></span></fieldset>
        <fieldset><span class="legend" data-i18n="wd.speed">Falling speed</span><div class="seg" id="seg-speed"></div><span class="speed-note" id="speed-note"></span></fieldset>
        <fieldset><span class="legend" data-i18n="wd.atOnce">Words on screen at once</span><div class="seg" id="seg-max"></div><span class="hint" data-i18n="wd.atOnceHint"></span></fieldset>
        <label class="switch"><input type="checkbox" id="sound"> <span data-i18n="soundEffects">Sound effects</span></label>
        <div class="start-row">
          <p class="error" id="setup-error" role="alert" hidden></p>
          <button class="btn btn-primary btn-big" id="start" type="button" data-i18n="startGame">Start game</button>
          <span class="keyhint" data-i18n-html="wd.keyHint"></span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- GAME -->
<section id="view-game" hidden>
  <div class="bar">
    <div data-logo></div>
    <span class="progress" id="progress"></span>
    <span class="spacer"></span>
    <button class="icon-btn" id="btn-full" type="button" data-i18n-attr="aria-label:fullScreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="icon-btn" id="btn-pause" type="button" data-i18n-attr="aria-label:pause"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg></button>
  </div>
  <div class="board" id="board"></div>
  <div class="field" id="field">
    <span class="task-pill" id="task-pill" hidden></span>
    <div class="floor" id="floor"></div>
    <div class="overlay" id="overlay" hidden><div class="card" id="card"></div></div>
  </div>
</section>

<script src="word-drop.js"></script>
</body>
</html>
