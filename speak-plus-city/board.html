<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="css/board.css">
<title>Board · Speak Plus City</title>
</head>
<body class="board-page">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="plus" viewBox="0 0 40 40"><g transform="rotate(12 20 20)"><line x1="20" y1="6" x2="20" y2="34" stroke="#E8483B" stroke-width="8.5" stroke-linecap="round"/><line x1="6" y1="20" x2="34" y2="20" stroke="#E8483B" stroke-width="8.5" stroke-linecap="round"/></g></symbol>
  </defs>
</svg>
<div class="file-warning" id="file-warning" hidden>This page needs a local server: double-click <b>start.command</b> (Mac) or <b>start.bat</b> (Windows), or run <b>npx serve</b> in this folder. See README.md.</div>
<script>if (location.protocol === "file:") document.getElementById("file-warning").hidden = false;</script>
<main class="bp">
  <div class="board" id="board" aria-live="polite"></div>
  <aside class="side">
    <div class="side-head">
      <div class="brand"><div class="logo">speak<svg><use href="#plus"/></svg></div><div class="logo-jp">スピークプラス</div></div>
      <div class="side-title">Speak Plus City</div>
      <span id="conn" class="conn off"></span>
    </div>
    <div id="side-status" class="side-status"></div>
    <div id="side-players" class="side-players"></div>
    <div class="side-foot"><span class="keyhint"><kbd>?</kbd> shortcuts · <kbd>F</kbd> full screen</span></div>
  </aside>
</main>
<div id="overlays"></div>
<div id="banners" class="banners"></div>
<div id="toasts" class="toasts"></div>
<canvas id="confetti" class="confetti" hidden></canvas>
<script type="module" src="js/board.js"></script>
</body>
</html>
