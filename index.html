<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classroom Games</title>
<meta name="description" content="Free classroom games for a projector or a tablet: any subject, any language, works offline.">
<script src="shared/config.js"></script>
<script src="shared/kit.js"></script>
<script src="shared/strings.js"></script>
<script src="shared/registry.js"></script>
<link rel="stylesheet" href="shared/fonts.css">
<link rel="stylesheet" href="shared/styles.css">
<link rel="stylesheet" href="shared/hub.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0E6363">
</head>
<body>
<section id="view-hub">
  <div class="wrap">
    <div class="topnav">
      <div class="brand"><div data-logo></div><div class="logo-jp" data-logo-sub hidden>スピークプラス</div></div>
      <div class="topnav-right"><span data-lang-switch></span></div>
    </div>
    <div class="hub-head">
      <span class="eyebrow" data-i18n="hub.forTeachers">For teachers</span>
      <h1 data-i18n="hub.title">Games that get the whole class talking</h1>
      <p data-i18n="hub.lead"></p>
    </div>
    <form class="filters" id="filters" onsubmit="return false">
      <label><span data-i18n="hub.students">Students</span><input type="number" id="f-size" min="1" max="200" inputmode="numeric" placeholder="–"></label>
      <label><span data-i18n="hub.ages">Ages</span><select id="f-age"></select></label>
      <label><span data-i18n="hub.level">Level</span><select id="f-level"></select></label>
      <label><span data-i18n="hub.time">Time</span><select id="f-time"></select></label>
      <label><span data-i18n="hub.skill">Skill</span><select id="f-skill"></select></label>
      <label class="check"><input type="checkbox" id="f-nodev"> <span data-i18n="hub.noDevices">No student devices</span></label>
      <span class="filter-count" id="f-count" role="status"></span>
    </form>
    <div class="games" id="games"></div>
    <section class="advanced" id="advanced">
      <h2 data-i18n="hub.advanced">Advanced: games with student phones</h2>
      <p data-i18n="hub.advancedLead"></p>
      <div class="games" id="games-advanced"></div>
    </section>
    <footer class="hub-foot">
      <span data-i18n="hub.foot.offline">Works offline after the first visit</span>
      <a href="LICENSE" data-i18n="hub.foot.code">Code: MIT licence</a>
      <a href="LICENSE-CONTENT.md" data-i18n="hub.foot.content">Word lists: CC BY 4.0</a>
      <a href="CONTRIBUTING.md" data-i18n="hub.foot.contribute">How to contribute</a>
    </footer>
  </div>
</section>
<script src="shared/hub.js"></script>
</body>
</html>
