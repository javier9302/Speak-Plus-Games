<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Run</title>
<script src="../shared/config.js"></script>
<script src="../shared/kit.js"></script>
<script src="../shared/strings.js"></script>
<script src="../shared/registry.js"></script>
<script src="strings.js"></script>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/styles.css">
<link rel="stylesheet" href="city-run.css">
<link rel="manifest" href="../manifest.webmanifest">
</head>
<body>

<!-- CITY RUN: SETUP -->
<section id="view-city-setup">
  <div class="wrap">
    <div class="row-between"><button class="link-back" id="cr-back-hub" type="button" data-i18n="allGames">← All games</button><span data-lang-switch></span></div>
    <div class="setup-head">
      <div><span class="eyebrow" data-i18n="gameSetup">Game setup</span><h1 data-i18n="cr.title">City Run</h1></div>
      <div data-logo></div>
    </div>
    <div class="setup">
      <div class="panel">
        <div class="field-group">
          <span class="legend" data-i18n="cr.how">How it works</span>
          <ol class="cr-steps">
            <li data-i18n-html="cr.step1"></li>
            <li data-i18n-html="cr.step2"></li>
            <li data-i18n-html="cr.step3"></li>
            <li data-i18n-html="cr.step4"></li>
          </ol>
        </div>
        <div class="field-group">
          <span class="legend" data-i18n="cr.penaltiesTitle">Time penalties</span>
          <div class="tags" id="cr-pen-tags"></div>
        </div>
        <div class="field-group">
          <span class="legend" data-i18n="cr.useful">Useful language</span>
          <div class="tags" id="cr-phrase-tags"></div>
        </div>
        <p class="hint" data-i18n="cr.mirrorHint"></p>
        <details class="more" id="cr-content">
          <summary data-i18n="cr.contentTitle">Places, phrases and quiz questions</summary>
          <div class="field-group">
            <p class="hint" data-i18n="cr.contentHint"></p>
            <div id="cr-place-tools"></div>
            <div class="row-between"><label for="cr-places" data-i18n="cr.places">Places</label><span class="count" id="cr-place-count"></span></div>
            <p class="hint" data-i18n="cr.placesFormat"></p>
            <textarea id="cr-places" spellcheck="false" rows="8"></textarea>
            <label for="cr-phrases" data-i18n="cr.useful">Useful language</label>
            <textarea id="cr-phrases" spellcheck="false" rows="4"></textarea>
            <label for="cr-lang" data-i18n="cr.contentLang">Language students speak</label>
            <select class="kit-select" id="cr-lang"></select>
          </div>
          <div class="field-group">
            <div id="cr-quiz-tools"></div>
            <div class="row-between"><label for="cr-quiz" data-i18n="cr.quiz">Quiz questions</label><span class="count" id="cr-quiz-count"></span></div>
            <p class="hint" data-i18n="cr.quizFormat"></p>
            <textarea id="cr-quiz" spellcheck="false" rows="6"></textarea>
          </div>
        </details>
      </div>
      <div class="panel">
        <div class="field-group">
          <div class="row-between"><label for="cr-teams" data-i18n="cr.teams">Teams or pairs</label><span class="count" id="cr-team-count"></span></div>
          <p class="hint" data-i18n="cr.teamsHint"></p>
          <textarea id="cr-teams" spellcheck="false"></textarea>
          <div id="cr-roster"></div>
        </div>
        <fieldset><span class="legend" data-i18n="cr.level">Level</span><div class="seg" id="cr-seg-level"></div><span class="hint" id="cr-level-note"></span></fieldset>
        <fieldset><span class="legend" data-i18n="cr.mission">Mission</span><div class="seg" id="cr-seg-mission"></div><span class="hint" id="cr-mission-note"></span></fieldset>
        <fieldset><span class="legend" data-i18n="cr.rounds">Rounds</span><div class="seg" id="cr-seg-rounds"></div><span class="hint" data-i18n="cr.roundsHint"></span></fieldset>
        <fieldset><span class="legend" data-i18n="cr.limit">Time limit per run</span><div class="seg" id="cr-seg-limit"></div></fieldset>
        <label class="switch"><input type="checkbox" id="cr-sound"> <span data-i18n="soundEffects">Sound effects</span></label>
        <div class="start-row">
          <p class="error" id="cr-setup-error" role="alert" hidden></p>
          <button class="btn btn-primary btn-big" id="cr-start" type="button" data-i18n="startGame">Start game</button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- CITY RUN: GAME -->
<section id="view-city-game" hidden>
  <div class="bar">
    <div data-logo></div>
    <span class="progress" id="cr-progress"></span>
    <span class="spacer"></span>
    <button class="icon-btn" id="cr-btn-full" type="button" data-i18n-attr="aria-label:fullScreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="icon-btn" id="cr-btn-pause" type="button" data-i18n-attr="aria-label:pause"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg></button>
  </div>
  <div class="board" id="cr-board"></div>
  <div class="cr-main">
    <div class="cr-stage" id="cr-stage">
      <svg class="cr-map" id="cr-map" viewBox="0 0 1300 1000" role="img" data-i18n-attr="aria-label:cr.map"></svg>
      <div class="cr-toast" id="cr-toast" hidden></div>
      <div class="cr-code" id="cr-code" hidden></div>
      <div class="overlay" id="cr-overlay" hidden><div class="card" id="cr-card"></div></div>
    </div>
    <aside class="cr-side">
      <div class="cr-box">
        <span class="eyebrow" data-i18n="cr.drivingNow">Driving now</span>
        <div class="cr-team" id="cr-team"></div>
        <div class="cr-time" id="cr-time">0:00.0</div>
        <div class="cr-pen" id="cr-pen"></div>
        <div class="cr-fuel" id="cr-fuel" hidden></div>
      </div>
      <div class="cr-box">
        <span class="eyebrow" data-i18n="cr.todo">To do</span>
        <ul class="cr-tasks" id="cr-tasks"></ul>
      </div>
      <div class="cr-box cr-say">
        <span class="eyebrow" data-i18n="cr.useful">Useful language</span>
        <ul class="cr-phrases" id="cr-say"></ul>
      </div>
      <button class="btn btn-ghost" id="cr-teacher" type="button"></button>
      <div class="cr-pad" data-i18n-attr="aria-label:cr.controls">
        <button class="icon-btn" type="button" data-key="left" data-i18n-attr="aria-label:cr.turnLeft">←</button>
        <button class="icon-btn" type="button" data-key="up" data-i18n-attr="aria-label:cr.stepForward">↑</button>
        <button class="icon-btn" type="button" data-key="right" data-i18n-attr="aria-label:cr.turnRight">→</button>
        <button class="icon-btn cr-pad-wide" type="button" data-key="act" data-i18n="cr.stopAtDoor">Stop at door</button>
      </div>
      <span class="keyhint" data-i18n-html="cr.keyHint"></span>
    </aside>
  </div>
</section>

<script src="city-run.js"></script>
</body>
</html>
